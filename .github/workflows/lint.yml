name: lint

env:
  # It's really `--all-features`, but not adding the mutually exclusive features from rkyv
  ALL_NON_EXCLUSIVE_FEATURES: --features "default unstable-locales rkyv-64 rkyv-validation serde arbitrary"

on:
  push:
    branches: [main, 0.4.x]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, i686-pc-windows-msvc
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check -- --color=always
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --check --manifest-path bench/Cargo.toml
      - run: |
          cargo clippy ${{ env.ALL_NON_EXCLUSIVE_FEATURES }} --all-targets --color=always \
            -- -D warnings
      - run: |
          cargo clippy --target=x86_64-pc-windows-msvc --all-targets --color=always \
            -- -D warnings
      - run: |
          cargo clippy --target=i686-pc-windows-msvc --all-targets --color=always \
            -- -D warnings
      - run: |
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --color=always \
            -- -D warnings
      - run: |
          cargo clippy --manifest-path bench/Cargo.toml --all-targets --color=always \
            -- -D warnings
        env:
          RUSTFLAGS: "-Dwarnings"

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2

  check-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - run: cargo install --locked cargo-deadlinks@0.8.1
      - run: cargo deadlinks -- ${{ env.ALL_NON_EXCLUSIVE_FEATURES }}
      - run: cargo doc ${{ env.ALL_NON_EXCLUSIVE_FEATURES }} --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  cffconvert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: --validate

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Keep rust-toolchain and cargo-semver-checks pinned together:
      # cargo-semver-checks only reads the rustdoc JSON formats it was built for.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-semver-checks@0.51.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The 0.5 line keeps the chrono 0.4 public API, so every release, including
      # 0.4.46 -> 0.5.0, is checked as non-breaking. Rust trait impls of rkyv 0.8
      # are outside what the tool models.
      - run: |
          cargo semver-checks check-release --release-type minor --default-features
          cargo semver-checks check-release --release-type minor \
            --only-explicit-features --features default,unstable-locales,rkyv-64,rkyv-validation,serde,arbitrary

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: |
          files=$(cargo package --list)
          for required in NOTICE SECURITY.md LICENSE.txt README.md src/lib.rs; do
            echo "$files" | grep -qx "$required" || { echo "missing from package: $required"; exit 1; }
          done
      - run: cargo publish --dry-run

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      # Build from source instead of taiki-e/install-action: its binstall fallback
      # ships a musl cargo-fuzz, which targets musl and breaks the sanitizer build.
      - run: cargo install --locked cargo-fuzz@0.13.2
      - run: cargo fuzz run fuzz_tzif -- -max_total_time=60
        working-directory: fuzz
      - run: cargo fuzz run fuzz_tz_string -- -max_total_time=60
        working-directory: fuzz
      - run: cargo fuzz run fuzz_reader -- -max_total_time=60
        working-directory: fuzz
      - run: cargo fuzz run fuzz_format -- -max_total_time=60
        working-directory: fuzz
