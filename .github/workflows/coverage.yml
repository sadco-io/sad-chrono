name: coverage

env:
  # It's really `--all-features`, but not adding the mutually exclusive features from rkyv
  ALL_NON_EXCLUSIVE_FEATURES: --features "default unstable-locales rkyv-64 rkyv-validation serde arbitrary"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: llvm-cov
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # nightly is required for --doctests, see cargo-llvm-cov#2. rustfmt is needed by
      # tests/win_bindings.rs (windows-bindgen formats its output with it).
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
          components: llvm-tools-preview, rustfmt
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Generate code coverage
        run: cargo +nightly llvm-cov ${{ env.ALL_NON_EXCLUSIVE_FEATURES }} --workspace --lcov --doctests --output-path lcov.info
      # Coverage is always generated, so breakage shows up even without Codecov. The upload
      # only runs when the CODECOV_TOKEN repository secret is set (it is never available on
      # PRs from forks). The token is scoped to the steps that need it, not the whole job, so
      # dependency build scripts and proc-macros never see it.
      - name: Check for Codecov token
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CODECOV_TOKEN is not set; skipping the Codecov upload."
          fi
      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.enabled == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
