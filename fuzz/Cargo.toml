
[package]
name = "chrono-fuzz"
version = "0.0.0"
authors = ["David Korczynski <david@adalogics.com>"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.chrono]
package = "sad-chrono"
path = ".."
features = ["__internal_fuzz"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_reader"
path = "fuzz_targets/fuzz_reader.rs"

[[bin]]
name = "fuzz_format"
path = "fuzz_targets/fuzz_format.rs"

[[bin]]
name = "fuzz_tzif"
path = "fuzz_targets/fuzz_tzif.rs"

[[bin]]
name = "fuzz_tz_string"
path = "fuzz_targets/fuzz_tz_string.rs"
